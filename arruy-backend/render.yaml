services:
  - type: web
    name: aruy-api
    runtime: node
    rootDir: arruy-backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: aruy-portafolio
